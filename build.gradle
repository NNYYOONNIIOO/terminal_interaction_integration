buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.2.5-1.16.5'
group = 'nyonio.terminal_interaction_integration'
archivesBaseName = 'terminal_interaction_integration'

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    // Match the supplied AE2 8.4.x source tree.
    mappings channel: 'snapshot', version: '20210309-1.16.5'
    runs {
        client {
            workingDirectory project.file(project.hasProperty('tiiSmoke') ? 'run-smoke' : 'run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--mixin.config', 'mixins.terminal_interaction_integration.json'
            mods {
                terminal_interaction_integration { source sourceSets.main }
                if (project.hasProperty('tiiSmoke')) {
                    tii_smoketest { source sourceSets.test }
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--mixin.config', 'mixins.terminal_interaction_integration.json'
            args '--nogui'
            mods { terminal_interaction_integration { source sourceSets.main } }
        }
    }
}

// A test-only addon exercises Forge registration and real Mixin transformation.
if (project.hasProperty('tiiSmoke')) {
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn tasks.named('testClasses') }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://modmaven.dev/'
        content { includeGroup 'appeng' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.34'
    implementation fg.deobf('appeng:appliedenergistics2:8.4.7')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:3.12.4'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'terminal_interaction_integration',
            'Specification-Vendor': 'nyonio',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'nyonio',
            'MixinConfigs': 'mixins.terminal_interaction_integration.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications { mavenJava(MavenPublication) { artifact jar } }
}
